[workspace]
members = ["crates/drifter-core", "crates/drifter", "crates/drifter-settings", "crates/drifter-activity", "crates/drifter-explorer", "crates/drifter-markup", "crates/drifter-blue", "crates/drifter-net", "crates/drifter-login", "crates/drifter-terminal", "vendor/owly/crates/owly-awdl", "vendor/owly/crates/owly-airdrop", "vendor/owly/crates/owly-radio", "vendor/owly/crates/owlyd", "vendor/owly/crates/owly-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
drifter-core = { path = "crates/drifter-core" }
drifter-blue = { path = "crates/drifter-blue" }
drifter-net = { path = "crates/drifter-net" }
