# Drifter. One file, set once.
# Relative paths start from this file. Absolute paths are used as written.

[workspace]
# World size, counted in screens.
# 3 by 3 on a 1080p screen gives 5760 x 3240 px.
width = 3
height = 3

# PNG or JPEG. Drifter reads the format from the first bytes of the file.
# If the file is missing, Drifter logs it and runs with no wallpaper.
wallpaper = "../img/wallpaper.jpeg"

# fixed    one screen. Stays put at every zoom.
# pan      world sized. Moves and zooms with the world.
# parallax any size between those two. Moves slower than the world.
wallpaper_mode = "fixed"

[input]
# Held for camera work. Scroll to zoom, push an edge to pan.
# While held, the drawers and the hot corner stay closed.
# Choices: super, alt, ctrl.
modifier = "ctrl"

[drawers]
# Bar heights in pixels. Minimum 16.
# Top holds the tray. Bottom holds the dock.
top = 36
bottom = 64

[dock]
# Apps pinned at the left, named by desktop file without .desktop.
# Example: ["foot", "com.github.hluk.copyq"]
# Empty means Drifter reads your XDG defaults for browser, files and terminal.
pinned = []

[tray]
# strftime. %a weekday, %b month, %d day, %I hour on 12, %H hour on 24,
# %M minute, %S second, %p AM or PM.
format = "%a %b %d %I:%M:%S %p"

# Text height in pixels for the clock and the system info. Minimum 6.
size = 13

# System info at the left of the tray, right of the tray icons.
# false hides it.
stats = true

# What the system info shows, left to right. Each one is a percentage.
# "cpu"   all cores together
# "ram"   memory in use
# a disk  by mount point, like "/" or "/home",
#         or by device, like "sda3" or "nvme0n1p2".
#         Its label is the device name, like SDA3.
metrics = ["cpu", "ram", "/"]

[assets]
# PNG with transparency. The top left pixel is the point that clicks.
cursor = "../img/cursor.png"

# TTF. Without this key Drifter searches the usual system font paths.
# With no font anywhere, Drifter starts and skips the clock.
font = "../fonts/WorkSans.ttf"

# Folder holding the window skin: title bar pieces, edges, corners,
# the same set again as -idle, and buttons with -hover and -press.
# Sizes come from the art. A taller title-mid.png gives a taller title bar.
window = "../img/window"

# Folder holding the dock icons: settings.png, trash.png, app.png and the rest.
# A pinned app with no icon of its own falls back to app.png here.
dock = "../img/dock"
