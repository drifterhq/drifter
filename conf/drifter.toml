# Drifter. One file, set once.
# Paths are relative to this file. An absolute path is used as written.

[workspace]
# The world, counted in screens. 3 by 3 on a 1080p screen is 5760 x 3240 px.
# Fixed forever. It is never grown by window sprawl.
width = 3
height = 3

# Any PNG or JPEG. The format is read from the file, not from its name.
# A missing file is reported and Drifter starts with no wallpaper.
wallpaper = "../img/wallpaper.jpeg"

# fixed    one screen, never moves, never zooms. The cheap one.
# pan      world sized, moves and zooms with the world, so it reads as a map.
# parallax any size between the two, moves slower than the world.
wallpaper_mode = "fixed"

[input]
# The key held for camera work: zoom with the scroll wheel, pan by pushing
# an edge. While it is held the drawers and the hot corner stay out of the way.
# super, alt or ctrl.
modifier = "ctrl"

[drawers]
# Height in pixels of each bar. The top holds the tray, the bottom is the dock.
# Push the pointer at an edge to open one. At least 16.
top = 36
bottom = 64

[dock]
# Apps pinned to the left of the dock, by desktop file name without .desktop.
# Leave it empty and Drifter uses the XDG defaults: your browser, your file
# manager and your terminal.
pinned = []

[tray]
# strftime, so %a weekday, %b month, %d day, %I hour 12, %M minute,
# %S second, %p AM or PM. %H is the 24 hour clock.
format = "%a %b %d %I:%M:%S %p"

# Clock text height in pixels. At least 6.
size = 13

[assets]
# Any PNG with transparency. The TOP LEFT PIXEL is the point that clicks.
cursor = "../img/cursor.png"

# Any TTF. Without it Drifter looks for a normal system font, and with no
# font at all it skips the clock rather than refusing to start.
font = "../fonts/WorkSans.ttf"

# The folder holding the window skin: the title bar pieces, the edges, the
# corners, the same again as -idle, and the buttons with -hover and -press.
# The art sets the sizes, so a taller title-mid.png gives a taller title bar.
window = "../img/window"
