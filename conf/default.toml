# Drifter. One file, set once.
# Relative paths start from this file. Absolute paths are used as written.

[workspace]
# World size, counted in screens.
# 3 by 3 on a 1080p screen gives 5760 x 3240 px.
width = 3
height = 3

# PNG or JPEG. Drifter reads the format from the first bytes of the file.
# If the file is missing, Drifter logs it and runs with no wallpaper.
wallpaper = "../img/wallpaper.jpeg"

# fixed    one screen. Stays put at every zoom.
# pan      world sized. Moves and zooms with the world.
# parallax any size between those two. Moves slower than the world.
wallpaper_mode = "fixed"

# A folder of PNG and JPEG pictures. The settings window shows them to pick
# from. With wallpaper_every above 0, Drifter moves to another picture from
# the folder every that many seconds, "random" or "ordered" by file name.
# wallpaper_folder = "../img"
wallpaper_every = 0
wallpaper_order = "random"

[input]
# Held for camera work. Scroll to zoom, push an edge to pan.
# While held, the drawers and the hot corner stay closed.
# Choices: super, alt, ctrl.
modifier = "ctrl"

[touchpad]
# Tap the pad to click. One finger is left, two is right.
tap = true
# A three finger tap: "overview" zooms out like the hot corner, and
# again flies back in. "middle" is a middle click.
three_tap = "overview"
# Swipe with three fingers to pan the camera.
swipe = true
# The page follows your fingers, as on a phone.
natural = false
# Pointer speed, 0 to 10. 5 is the middle.
speed = 5
# A fast finger moves the pointer farther.
accel = true
# The pad does nothing while you type.
ignore_while_typing = true

# Monitors. Settings > Displays writes these for you.
# One table per monitor, found by its connector name. Drifter prints the
# names when it starts, like "screen      HDMI-A-1 1920 x 1080 @ 60".
# scale    1 to 3. 2 makes text and windows twice as big.
# rotate   0, 90, 180 or 270.
# x, y     where it sits beside the others, in pixels after scale.
#          A monitor with no place goes to the right of the rest.
# [[monitor]]
# name = "HDMI-A-1"
# scale = 1.5
# rotate = 0
# x = 0
# y = 0

[night]
# Warmer colors at night, easier on the eyes in the dark.
on = false
# Kelvin at night. 1900 is very warm, 6500 is plain white.
warmth = 4000
# Hours, 0 to 23. Night runs from start to end, through midnight.
start = 21
end = 7

[keyboard]
# The layout, like "us", "de" or "gb". Empty uses the system default.
layout = ""
# A variant of the layout, like "dvorak" for "us". Empty is the plain one.
variant = ""
# xkb options, comma separated, like "caps:escape,compose:ralt".
options = ""
# Milliseconds a key is held before it repeats. 100 to 1000.
repeat_delay = 200
# Repeats a second while it is held. 5 to 60.
repeat_rate = 25

[drawers]
# Bar heights in pixels. Minimum 16.
# Top holds the tray. Bottom holds the dock.
top = 36
bottom = 64

[dock]
# Apps pinned at the left. A name is a desktop file without .desktop.
# A table can hold a command line instead, and either can have its own icon:
#   pinned = ["foot", { app = "firefox", icon = "/home/me/fox.png" },
#             { command = "foot -e htop" }]
pinned = []

# Built-in dock entries. The file manager, terminal and browser are the
# ones your system names as defaults. Each is true to show it, false to hide.
files = true
terminal = true
browser = true
settings = true
trash = true

[window]
# Which end of the title bar holds the buttons: left or right.
buttons = "left"
# The buttons, left to right. Name each of close, minimize, maximize once.
order = ["close", "minimize", "maximize"]
# Show the window title in the middle of the title bar.
title = true

[lock]
# Minutes with no input before the screen locks. 0 never locks.
# An app that keeps the screen awake, like a video player, holds it off.
after = 0
# Minutes with no input before the screen turns off. 0 keeps it on.
# Any key or pointer move turns it back on.
screen_off = 10

[apps]
# Your file manager, terminal and web browser. Same forms as the dock:
#   browser = "firefox-esr"   or   terminal = { command = "foot -e fish" }
# A missing key uses the one the system names as default.
# files = "pcmanfm"

[login]
# Started each time Drifter starts, in this order. Same forms as the dock.
start = []

[tray]
# strftime. %a weekday, %b month, %d day, %I hour on 12, %H hour on 24,
# %M minute, %S second, %p AM or PM.
format = "%a %b %d %I:%M:%S %p"

# Text height in pixels for the clock and the system info. Minimum 6.
size = 13

# System info at the left of the tray, right of the tray icons.
# false hides it.
stats = true

# What the system info shows, left to right. Each one is a percentage.
# "cpu"   all cores together
# "ram"   memory in use
# "battery"  charge left, CHG while charging. Hidden with no battery
# a disk  by mount point, like "/" or "/home",
#         or by device, like "sda3" or "nvme0n1p2".
#         Its label is the device name, like SDA3.
metrics = ["cpu", "ram", "/", "battery"]

[assets]
# PNG with transparency. The top left pixel is the point that clicks.
cursor = "../img/cursor.png"

# TTF. Without this key Drifter searches the usual system font paths.
# With no font anywhere, Drifter starts and skips the clock.
font = "../fonts/WorkSans.ttf"

# Folder holding the window skin: title bar pieces, edges, corners,
# the same set again as -idle, and buttons with -hover and -press.
# Sizes come from the art. A taller title-mid.png gives a taller title bar.
window = "../img/window"

# Folder holding the dock icons: settings.png, trash.png, app.png and the rest.
# A pinned app with no icon of its own falls back to app.png here.
dock = "../img/dock"
