[package]
name = "owly-cli"
description = "The owly command-line client."
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/t4t5/owly"
publish = false

[[bin]]
name = "owly"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
nix = { version = "0.31", default-features = false, features = ["hostname", "net", "signal", "user"] }
owly-airdrop = { path = "../owly-airdrop", features = ["mdns"] }
owly-awdl = { path = "../owly-awdl" }
owly-radio = { path = "../owly-radio" }
owlyd = { path = "../owlyd" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tempfile = "3"
