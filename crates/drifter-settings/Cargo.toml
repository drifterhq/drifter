[package]
name = "drifter-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drifter-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
drifter-blue.workspace = true
drifter-net.workspace = true
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"
zbus = { version = "5.19.0", features = ["blocking-api"] }
accesskit = "0.25"
accesskit_unix = "0.24"
