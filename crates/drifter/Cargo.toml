[package]
name = "drifter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drifter-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
calloop = { version = "0.14", features = ["signals"] }
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "wayland_frontend",
] }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["server", "unstable", "staging"] }
zbus = { version = "5.19.0", features = ["blocking-api"] }
