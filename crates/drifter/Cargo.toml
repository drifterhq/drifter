[package]
name = "drifter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop that is a camera over one large world"

[dependencies]
drifter-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
drifter-blue.workspace = true
calloop = { version = "0.14", features = ["signals"] }
drm-ffi = "0.9.1"
accesskit = "0.25"
accesskit_unix = "0.24"
libc = "0.2.189"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "wayland_frontend",
] }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["server", "unstable", "staging"] }
xcursor = "0.3.11"
zbus = { version = "5.19.0", features = ["blocking-api"] }
zeroize = "1.9.0"
async-channel = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[package.metadata.deb]
name = "drifter"
maintainer = "donuts-are-good <96031819+donuts-are-good@users.noreply.github.com>"
copyright = "donuts-are-good"
extended-description = "A Wayland desktop where the window manager is a camera over one large world. Windows stay where you put them."
section = "x11"
priority = "optional"
depends = "$auto, libegl1, libgles2, adwaita-icon-theme, pipewire, wireplumber, xdg-desktop-portal, xdg-desktop-portal-wlr, xdg-desktop-portal-gtk, seatd | systemd"
recommends = "drifter-explorer, network-manager-gnome, bluez, bluez-obexd, udisks2, power-profiles-daemon, iw, xwayland, foot, grim, qt6-gtk-platformtheme, qt5-gtk-platformtheme, accountsservice, openssl, wf-recorder, pulseaudio-utils, xsettingsd"
suggests = "orca"
assets = [
    ["target/release/drifter", "usr/bin/", "755"],
    ["target/release/drifter-settings", "usr/bin/", "755"],
    ["target/release/drifter-markup", "usr/bin/", "755"],
    ["target/release/drifter-activity", "usr/bin/", "755"],
    ["../../dist/drifter-activity.desktop", "usr/share/applications/", "644"],
    ["../../scripts/drifter-session", "usr/bin/", "755"],
    ["../../dist/drifter.desktop", "usr/share/wayland-sessions/", "644"],
    ["../../dist/pam-drifter", "etc/pam.d/drifter", "644"],
    ["../../dist/61-drifter-pixelbook.hwdb", "usr/lib/udev/hwdb.d/", "644"],
    ["../../conf/drifter-portals.conf", "usr/share/xdg-desktop-portal/", "644"],
    ["../../conf/xdpw.conf", "etc/xdg/xdg-desktop-portal-wlr/drifter", "644"],
    ["../../conf/default.toml", "usr/share/drifter/conf/", "644"],
    ["../../img/cursor.png", "usr/share/drifter/img/", "644"],
    ["../../shaders/*", "usr/share/drifter/shaders/", "644"],
    ["../../img/dock/*", "usr/share/drifter/img/dock/", "644"],
    ["../../img/window/*", "usr/share/drifter/img/window/", "644"],
    ["../../img/users/*", "usr/share/drifter/img/users/", "644"],
    ["../../fonts/*", "usr/share/drifter/fonts/", "644"],
    ["../../icons/drifter-icons/index.theme", "usr/share/icons/drifter-icons/", "644"],
    ["../../icons/drifter-icons/256x256/apps/*", "usr/share/icons/drifter-icons/256x256/apps/", "644"],
    ["../../icons/drifter-icons/256x256/places/*", "usr/share/icons/drifter-icons/256x256/places/", "644"],
    ["../../icons/drifter-icons/256x256/devices/*", "usr/share/icons/drifter-icons/256x256/devices/", "644"],
    ["../../icons/drifter-icons/256x256/mimetypes/*", "usr/share/icons/drifter-icons/256x256/mimetypes/", "644"],
]
